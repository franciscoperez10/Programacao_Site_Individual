<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos</title>
    <link rel="stylesheet" href="style2.css">
</head>

<!-- Navbar -->
<body>
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="homepage">
                <img src="homepage.png" alt="Homepage">
            </a>
            <div class="nav-links">
                <a href="#">Acomodação</a>
                <a href="#">Locais</a>
                <a href="#">Blog</a>
                <a href="#">Contatos</a>
            </div>
        </nav>
        <!-- Formulário de contacto -->
        <div class="hero">
            <div class="form-container">
                <form id="contact-form" action="#" method="post">
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="mensagem">Mensagem:</label>
                        <textarea id="mensagem" name="mensagem" required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">Enviar</button>
                </form>
        </div>
    </div>
    <div class="bg-image"></div>
    </div>

    <!-- Bootstrap link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu1OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
